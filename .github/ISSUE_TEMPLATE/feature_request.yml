name: Feature request
description: Propose a capability or improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the deployment scenario first. Feature counts are
        less useful than reproducible needs and acceptance criteria.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should we verify that this is done?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion and parsing
        - Retrieval and answers
        - Access control and tenancy
        - Connectors
        - Operations and deployment
        - Frontend and accessibility
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request does not disclose a security vulnerability.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
