name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners are outside mainland China; the repository default goproxy.cn is
  # slow there and is used by both the Go toolchain and Docker builds.
  GO_PROXY: https://proxy.golang.org,direct

jobs:
  verify:
    runs-on: ubuntu-latest
    # The race build recompiles every package with cgo instrumentation.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Dependency direction
        run: go run ./cmd/checkdeps
      - name: OpenAPI drift check
        run: go run ./cmd/openapi -check
      - name: Tenancy static gate
        run: go run ./cmd/checktenancy
      - name: Go tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./internal/... ./cmd/...
      - name: Go vet
        run: go vet ./...
      - name: Go module checksums
        run: go mod verify
      - name: Web tests and build
        working-directory: web
        run: |
          npm ci
          npm run codegen:check
          npm test -- --passWithNoTests
          npm run e2e:typecheck
          npm run build
      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run codegen:check
          npm test
          npm run typecheck
      - name: Python SDK tests
        run: |
          python -m pip install -r sdk/python/requirements-dev.txt
          cd sdk/python && PYTHONPATH=. pytest -q
      - name: Compose configuration
        run: docker compose --env-file .env.example -f deploy/docker-compose/docker-compose.yml config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: rag-ci
      ACCEPTANCE_ENV_FILE: .env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare enforce profile
        run: |
          cp deploy/ci/enforce.env .env
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml config --quiet
      - name: Start dependencies
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml \
            up -d --build --wait postgres redis minio docreader
      - name: Migrate, roles, seed and index
        run: |
          make migrate
          make m13-rls-setup
          make seed
          make embed-index
      - name: Postgres RLS tests
        env:
          TEST_POSTGRES_URL: postgres://rag_platform:change-me-local-only@localhost:5432/rag_platform?sslmode=disable
        run: go test -short ./tests/postgres/... -count=1
      - name: M0 acceptance
        run: ./scripts/m0_acceptance.sh
      - name: M1 acceptance
        run: ./scripts/m1_acceptance.sh
      - name: Enforce RLS acceptance
        run: ENFORCE_LAYOUT=1 ./scripts/m13_rls_acceptance.sh
      - name: Async acceptance
        run: ./scripts/m13_async_acceptance.sh
      - name: Dump compose logs
        if: failure()
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml \
            logs --tail=200 api worker migrate seed || true
      - name: Stop stack
        if: always()
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml down -v || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: rag-e2e
      GO_PROXY: https://proxy.golang.org,direct
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:8082/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Typecheck E2E
        working-directory: web
        run: npm run e2e:typecheck
      - name: Start quickstart stack
        run: ./scripts/quickstart.sh
      - name: Run E2E
        working-directory: web
        run: npm run e2e
      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: MCP and SDK acceptance
        run: ./scripts/b16_acceptance.sh
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Dump compose logs
        if: failure()
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose/docker-compose.yml \
            -f deploy/docker-compose/quickstart.compose.yml \
            logs --tail=200 api worker web || true
      - name: Stop stack
        if: always()
        run: |
          docker compose --env-file .env \
            -f deploy/docker-compose/docker-compose.yml \
            -f deploy/docker-compose/quickstart.compose.yml \
            down -v || true

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: rag-eval
      COMPOSE_FILES: "-f deploy/docker-compose/docker-compose.yml -f deploy/ci/eval.compose.yml"
      EVAL_CHAT_BASE_URL: ${{ vars.EVAL_CHAT_BASE_URL }}
      EVAL_CHAT_API_KEY: ${{ secrets.EVAL_CHAT_API_KEY }}
      EVAL_CHAT_MODEL: ${{ vars.EVAL_CHAT_MODEL }}
      EVAL_EMBEDDING_BASE_URL: ${{ vars.EVAL_EMBEDDING_BASE_URL }}
      EVAL_EMBEDDING_API_KEY: ${{ secrets.EVAL_EMBEDDING_API_KEY }}
      EVAL_EMBEDDING_MODEL: ${{ vars.EVAL_EMBEDDING_MODEL }}
      EVAL_EMBEDDING_DIMENSION: ${{ vars.EVAL_EMBEDDING_DIMENSION || '1024' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check live model credentials
        id: credentials
        run: |
          missing=""
          for name in EVAL_CHAT_BASE_URL EVAL_CHAT_API_KEY EVAL_CHAT_MODEL EVAL_EMBEDDING_BASE_URL EVAL_EMBEDDING_API_KEY EVAL_EMBEDDING_MODEL; do
            if [ -z "$(printenv "$name" || true)" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::live M3/M7 evaluation skipped; missing:$missing"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate evaluation sets
        run: make eval-validate
      - name: Prepare evaluation environment
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          cp deploy/ci/eval.env .env
          {
            printf 'CHAT_BASE_URL=%s\n' "$EVAL_CHAT_BASE_URL"
            printf 'CHAT_API_KEY=%s\n' "$EVAL_CHAT_API_KEY"
            printf 'LLM_CHAT_MODEL=%s\n' "$EVAL_CHAT_MODEL"
            printf 'EMBEDDING_BASE_URL=%s\n' "$EVAL_EMBEDDING_BASE_URL"
            printf 'EMBEDDING_API_KEY=%s\n' "$EVAL_EMBEDDING_API_KEY"
            printf 'LLM_EMBEDDING_MODEL=%s\n' "$EVAL_EMBEDDING_MODEL"
            printf 'EMBEDDING_DIMENSION=%s\n' "$EVAL_EMBEDDING_DIMENSION"
          } >> .env
          docker compose --env-file .env $COMPOSE_FILES config --quiet
      - name: Start dependencies
        if: steps.credentials.outputs.enabled == 'true'
        run: docker compose --env-file .env $COMPOSE_FILES up -d --build --wait postgres redis minio docreader
      - name: Migrate and seed
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          docker compose --env-file .env $COMPOSE_FILES run --rm --no-deps --build migrate
          docker compose --env-file .env $COMPOSE_FILES run --rm --no-deps --build seed
      - name: Build vector index
        if: steps.credentials.outputs.enabled == 'true'
        run: docker compose --env-file .env $COMPOSE_FILES run --rm --no-deps --entrypoint /usr/local/bin/embedctl api create-index --confirm
      - name: Start api and worker
        if: steps.credentials.outputs.enabled == 'true'
        run: docker compose --env-file .env $COMPOSE_FILES up -d --build --wait api worker
      - name: Check API health
        if: steps.credentials.outputs.enabled == 'true'
        run: curl -fsS http://localhost:8082/healthz
      - name: Run M3 gate
        id: m3
        if: steps.credentials.outputs.enabled == 'true'
        run: python3 scripts/eval_suite.py --suite m3 --report-dir tests/eval/ci --redact-base-url --embedding-model "$EVAL_EMBEDDING_MODEL" --embedding-dimension "$EVAL_EMBEDDING_DIMENSION"
      - name: Run M7 evaluation
        if: always() && steps.credentials.outputs.enabled == 'true' && (steps.m3.outcome == 'success' || steps.m3.outcome == 'failure')
        run: python3 scripts/eval_suite.py --suite m7 --report-dir tests/eval/ci --redact-base-url
      - name: Upload evaluation reports
        if: always() && steps.credentials.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: tests/eval/ci
          retention-days: 7
          if-no-files-found: warn
      - name: Dump compose logs
        if: failure() && steps.credentials.outputs.enabled == 'true'
        run: docker compose --env-file .env $COMPOSE_FILES logs --tail=200 api worker migrate seed || true
      - name: Stop stack
        if: always() && steps.credentials.outputs.enabled == 'true'
        run: docker compose --env-file .env $COMPOSE_FILES down -v || true

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config and alert rules
        run: |
          set -euo pipefail
          image=prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/etc/prometheus:ro" "$image" check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/etc/prometheus:ro" "$image" test rules /etc/prometheus/promtool/alerts_test.yml
      - name: Compose overlay
        run: docker compose --env-file .env.example -f deploy/docker-compose/docker-compose.yml -f deploy/docker-compose/observability.compose.yml config --quiet
      - name: Grafana dashboard JSON
        run: python -m json.tool deploy/observability/grafana/dashboards/rag-platform-overview.json > /dev/null

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Image pin check
        run: ./scripts/check_image_pins.sh
      - name: Build api image
        run: docker build --build-arg GOPROXY="$GO_PROXY" -t rag-platform-api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rag-platform-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: rag-platform-api:ci
          format: cyclonedx
          output: sbom-api.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-api
          path: sbom-api.cdx.json
