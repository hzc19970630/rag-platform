name: drills

on:
  schedule:
    # Quarterly recovery drills: 03:00 UTC on the first day of Jan/Apr/Jul/Oct.
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drills
  cancel-in-progress: false

env:
  GO_PROXY: https://proxy.golang.org,direct
  COMPOSE_PROJECT_NAME: rag-drills
  RTO_TARGET_SECONDS: "3600"
  RPO_TARGET_SECONDS: "900"

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ACCEPTANCE_ENV_FILE: .env
    steps:
      - uses: actions/checkout@v4
      - name: Prepare enforce profile
        run: |
          cp deploy/ci/enforce.env .env
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml config --quiet
      - name: Start dependencies
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml \
            up -d --build --wait postgres redis minio docreader
      - name: Migrate, roles and seed
        run: |
          make migrate
          make m13-rls-setup
          make seed
      - name: Start api and worker
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml \
            up -d --build --wait api worker
      - name: PITR drill
        run: make m13-pitr-drill
      - name: Object storage replication drill
        run: make m13-object-storage-drill
      - name: Logical backup drill
        run: make m13-backup-drill
      - name: Upload drill reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-drill-reports
          path: |
            tests/eval/m13_pitr_drill_report.json
            tests/eval/m13_object_storage_drill_report.json
            tests/eval/m13_backup_drill_report.json
          retention-days: 90
          if-no-files-found: warn
      - name: Dump compose logs
        if: failure()
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml \
            logs --tail=200 postgres api worker || true
      - name: Stop stack
        if: always()
        run: |
          docker compose --env-file .env -f deploy/docker-compose/docker-compose.yml down -v || true
