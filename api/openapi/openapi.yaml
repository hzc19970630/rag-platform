info:
  description: |-
    Resource-oriented contract for the RAG platform. Route ownership follows the
    domain resource, not the delivery milestone. This file is generated from
    contracts/httpapi; every Gin business route must have a matching entry there
    (see openapi_test.go).
  title: RAG Platform API
  version: 0.10.0
openapi: 3.0.3
paths:
  /api/v1/api-keys:
    get:
      operationId: get_api_keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
          description: Success
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: GET /api/v1/api-keys
      tags:
        - identity
    post:
      operationId: post_api_keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'
          description: Created
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: POST /api/v1/api-keys
      tags:
        - identity
  /api/v1/api-keys/{id}:
    delete:
      operationId: delete_api_keys_id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No content
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      summary: DELETE /api/v1/api-keys/{id}
      tags:
        - identity
  /api/v1/audit:
    get:
      operationId: get_audit
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
          description: Success
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: GET /api/v1/audit
      tags:
        - identity
  /api/v1/audit/authorization:
    get:
      operationId: get_audit_authorization
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
          description: Success
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: GET /api/v1/audit/authorization
      tags:
        - identity
  /api/v1/auth/callback:
    get:
      operationId: get_auth_callback
      responses:
        "302":
          description: Redirect to the web application
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: GET /api/v1/auth/callback
      tags:
        - auth
  /api/v1/auth/config:
    get:
      operationId: get_auth_config
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: Success
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: GET /api/v1/auth/config
      tags:
        - auth
  /api/v1/auth/dev-login:
    post:
      operationId: post_auth_dev_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
