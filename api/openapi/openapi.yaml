openapi: 3.0.3
info:
  title: RAG Platform API
  version: 0.10.0
  description: |
    Resource-oriented contract for the RAG platform. Route ownership follows the
    domain resource, not the delivery milestone. Every Gin business route must
    have a matching path and method here (see openapi_test.go).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: auth
  - name: identity
  - name: knowledge-bases
  - name: documents
  - name: conversations
  - name: connectors
  - name: projections
  - name: operations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: rag_session
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller may not access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
    GenericObject:
      type: object
      additionalProperties: true
    MeResponse:
      type: object
      properties:
        principal:
          type: object
          properties:
            subjectId: {type: string}
            tenantId: {type: string}
        scope:
          type: object
          properties:
            subjectId: {type: string}
            tenantId: {type: string}
            knowledgeBaseIds:
              type: array
              items: {type: string}
            capabilities:
              type: array
              items: {type: string}
            aclVersion: {type: string}
        developmentIdentity: {type: boolean}
    KnowledgeBase:
      type: object
      properties:
        id: {type: string}
        tenantId: {type: string}
        ownerId: {type: string}
        name: {type: string}
        description: {type: string}
        aclVersion: {type: integer, format: int64}
        retrievalConfig: {type: string}
        indexingStrategy: {type: string}
        embeddingModel: {type: string}
        embeddingDimension: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    KnowledgeBaseList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeBase'}
    KnowledgeBaseConfiguration:
      type: object
      additionalProperties: true
      properties:
        knowledgeBaseId: {type: string}
        indexingStrategy: {type: object, additionalProperties: true}
        retrieval: {type: object, additionalProperties: true}
        embedding: {type: object, additionalProperties: true}
        chunking: {type: object, additionalProperties: true}
        chat: {type: object, additionalProperties: true}
        rerank: {type: object, additionalProperties: true}
        parser: {type: object, additionalProperties: true}
    DocumentView:
      type: object
      properties:
        document: {type: object, additionalProperties: true}
        version: {type: object, additionalProperties: true}
        pipeline: {type: object, additionalProperties: true}
    DocumentPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DocumentView'}
        nextCursor: {type: string}
    Chunk:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        documentId: {type: string}
        content: {type: string}
        headingPath: {type: string}
        pageNumber: {type: integer}
    ChunkPage:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Chunk'}
        nextCursor: {type: string}
    EvidenceSet:
      type: object
      additionalProperties: true
      properties:
        schemaVersion: {type: string}
        requestId: {type: string}
        query: {type: string}
        items:
          type: array
          items: {type: object, additionalProperties: true}
        tokenEstimate: {type: integer}
        recallLatencyMs: {type: integer, format: int64}
        rerankApplied: {type: boolean}
        droppedByAuthorization: {type: integer}
    Conversation:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        knowledgeBaseId: {type: string}
        userId: {type: string}
        title: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConversationList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Conversation'}
    MessageView:
      type: object
      additionalProperties: true
      properties:
        message: {type: object, additionalProperties: true}
        citations:
          type: array
          items: {type: object, additionalProperties: true}
    MessageList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MessageView'}
    OpsMetrics:
      type: object
      additionalProperties: true
