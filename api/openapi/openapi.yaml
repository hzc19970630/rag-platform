openapi: 3.0.3
info:
  title: RAG Platform API
  version: 0.10.0
  description: |
    Resource-oriented contract for the RAG platform. Route ownership follows the
    domain resource, not the delivery milestone. Every Gin business route must
    have a matching path and method here (see openapi_test.go).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: auth
  - name: identity
  - name: knowledge-bases
  - name: documents
  - name: conversations
  - name: connectors
  - name: projections
  - name: operations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: rag_session
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller may not access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
    GenericObject:
      type: object
      additionalProperties: true
    RetrievalConfigOverride:
      type: object
      description: Optional knowledge-base tier fields; omitted fields keep the global default.
      properties:
        top_k: {type: integer}
        embedding_top_k: {type: integer}
        keyword_top_k: {type: integer}
        vector_threshold: {type: number}
        keyword_threshold: {type: number}
        rerank_enabled: {type: boolean}
        rerank_top_k: {type: integer}
        rerank_threshold: {type: number}
        vector_ef_search: {type: integer, minimum: 0, maximum: 1000}
        vector_oversample: {type: integer, minimum: 1, maximum: 20}
        vector_iterative_scan: {type: boolean}
        context_token_limit: {type: integer}
        adjacent_expansion: {type: integer}
        max_adjacent_chunks: {type: integer}
        rrf_k: {type: integer}
        expansion_score_factor: {type: number}
    MeResponse:
      type: object
      properties:
        principal:
          type: object
          properties:
            subjectId: {type: string}
            tenantId: {type: string}
        scope:
          type: object
          properties:
            subjectId: {type: string}
            tenantId: {type: string}
            knowledgeBaseIds:
              type: array
              items: {type: string}
            capabilities:
              type: array
              items: {type: string}
            aclVersion: {type: string}
        developmentIdentity: {type: boolean}
    KnowledgeBase:
      type: object
      properties:
        id: {type: string}
        tenantId: {type: string}
        ownerId: {type: string}
        name: {type: string}
        description: {type: string}
        aclVersion: {type: integer, format: int64}
        retrievalConfig: {type: string}
        indexingStrategy: {type: string}
        embeddingModel: {type: string}
        embeddingDimension: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    KnowledgeBaseList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeBase'}
    KnowledgeBaseCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 255}
        description: {type: string}
    KnowledgeBaseUpdateRequest:
      type: object
      description: >-
        Only supplied fields change. An empty chat_model or rerank_model clears
        the knowledge-base override so the deployment default applies again.
      properties:
        name: {type: string, maxLength: 255}
        description: {type: string}
        retrieval_config: {$ref: '#/components/schemas/RetrievalConfigOverride'}
        indexing_strategy: {type: object, additionalProperties: true}
        embedding_model: {type: string}
        embedding_dimension: {type: integer}
        chat_model: {type: string}
        rerank_model: {type: string}
    KnowledgeBaseMember:
      type: object
      properties:
        knowledgeBaseId: {type: string}
        userId: {type: string}
        role: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    KnowledgeBaseMemberList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/KnowledgeBaseMember'}
    KnowledgeBaseMemberCreateRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: {type: string}
        role: {type: string, enum: [viewer, editor]}
    ConversationCreateRequest:
      type: object
      required: [knowledge_base_id]
      properties:
        knowledge_base_id: {type: string}
        title: {type: string}
    MessageCreateRequest:
      type: object
      required: [query]
      properties:
        query: {type: string}
        requestId: {type: string}
        sessionOverride: {type: string}
    KnowledgeBaseConfiguration:
      type: object
      additionalProperties: true
      properties:
        knowledgeBaseId: {type: string}
        indexingStrategy: {type: object, additionalProperties: true}
        retrieval: {type: object, additionalProperties: true}
        embedding: {type: object, additionalProperties: true}
        chunking: {type: object, additionalProperties: true}
        chat: {type: object, additionalProperties: true}
        rerank: {type: object, additionalProperties: true}
        parser: {type: object, additionalProperties: true}
    DocumentView:
      type: object
      properties:
        document: {type: object, additionalProperties: true}
        version: {type: object, additionalProperties: true}
        pipeline: {type: object, additionalProperties: true}
        stages:
          type: array
          items: {type: object, additionalProperties: true}
    DocumentPage:
      type: object
      properties:
        schemaVersion: {type: string}
        knowledgeBaseId: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/DocumentSummary'}
        nextCursor: {type: string}
        hasMore: {type: boolean}
    Chunk:
      type: object
      properties:
        chunkId: {type: string}
        documentId: {type: string}
        documentVersionId: {type: string}
        knowledgeBaseId: {type: string}
        parentId: {type: string}
        ordinal: {type: integer}
        content: {type: string}
        contentHash: {type: string}
        headingPath: {type: string}
        pageNumber: {type: integer}
        sourcePath: {type: string}
        startOffset: {type: integer}
        endOffset: {type: integer}
        status: {type: string}
    ChunkPage:
      type: object
      properties:
        schemaVersion: {type: string}
        documentId: {type: string}
        versionId: {type: string}
        status: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/Chunk'}
        nextCursor: {type: integer}
        hasMore: {type: boolean}
    EvidenceSet:
      type: object
      additionalProperties: true
      properties:
        schemaVersion: {type: string}
        requestId: {type: string}
        authorizationScopeVersion: {type: string}
        query: {type: string}
        plan: {type: object, additionalProperties: true}
        items:
          type: array
          items: {type: object, additionalProperties: true}
        tokenEstimate: {type: integer}
        recallLatencyMs: {type: integer, format: int64}
        rerankApplied: {type: boolean}
        droppedByAuthorization: {type: integer}
    Conversation:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        tenantId: {type: string}
        knowledgeBaseId: {type: string}
        userId: {type: string}
        title: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConversationList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Conversation'}
    MessageView:
      type: object
      additionalProperties: true
      properties:
        message: {type: object, additionalProperties: true}
        citations:
          type: array
          items: {type: object, additionalProperties: true}
    MessageList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MessageView'}
    OpsMetrics:
      type: object
      additionalProperties: true
    AuthConfig:
      type: object
      required: [oidcEnabled, devAuthEnabled, sessionCookie, sessionTTLHours]
      properties:
        oidcEnabled: {type: boolean}
        oidcIssuer: {type: string}
        devAuthEnabled: {type: boolean}
        sessionCookie: {type: string}
        sessionTTLHours: {type: integer}
    DevLoginRequest:
      type: object
      properties:
        userId: {type: string}
        tenantId: {type: string}
    DevLoginResponse:
      type: object
      required: [token, expiresAt, user, principal]
      properties:
        token: {type: string}
        expiresAt: {type: string, format: date-time}
        user: {type: object, additionalProperties: true}
        principal: {type: object, additionalProperties: true}
    RefreshResponse:
      type: object
      required: [token, expiresAt]
      properties:
        token: {type: string}
        expiresAt: {type: string, format: date-time}
    APIKey:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        keyPrefix: {type: string}
        capabilities: {type: array, items: {type: string}}
        knowledgeBaseIds: {type: array, items: {type: string}}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    APIKeyList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/APIKey'}}
    APIKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        capabilities: {type: array, items: {type: string}}
        knowledgeBaseIds: {type: array, items: {type: string}}
        expiresAt: {type: string, format: date-time}
    APIKeyCreateResponse:
      type: object
      required: [apiKey, token]
      properties:
        apiKey: {$ref: '#/components/schemas/APIKey'}
        token: {type: string}
    TenantMember:
      type: object
      properties:
        userId: {type: string}
        email: {type: string}
        displayName: {type: string}
        role: {type: string}
    TenantMemberList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TenantMember'}}
    TenantMemberCreateRequest:
      type: object
      required: [userId, role]
      properties:
        userId: {type: string}
        role: {type: string}
    TenantMemberUpdateRequest:
      type: object
      required: [role]
      properties:
        role: {type: string}
    AuditEvent:
      type: object
      properties:
        id: {type: integer, format: int64}
        tenantId: {type: string}
        actorId: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        allowed: {type: boolean}
        reason: {type: string}
        requestId: {type: string}
        ipAddress: {type: string}
        userAgent: {type: string}
        createdAt: {type: string, format: date-time}
    AuditEventList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
    SearchRequest:
      type: object
      properties:
        query: {type: string}
        knowledgeBaseId: {type: string}
        sessionOverride: {type: string}
    WikiReviewRequest:
      type: object
      required: [action]
      properties:
        action: {type: string}
        note: {type: string}
    WikiRollbackRequest:
      type: object
      required: [version_id]
      properties:
        version_id: {type: string}
    GraphReviewRequest:
      type: object
      required: [action]
      properties:
        action: {type: string}
        note: {type: string}
    ConnectorConfig:
      type: object
      properties:
        manifestUrl: {type: string}
        requestsPerSecond: {type: number}
        maxItemsPerRun: {type: integer}
        aclMode: {type: string}
    CredentialInput:
      type: object
      properties:
        type: {type: string}
        token: {type: string}
        username: {type: string}
        password: {type: string}
    ConnectorCreateRequest:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {type: string}
        config: {$ref: '#/components/schemas/ConnectorConfig'}
        credential: {$ref: '#/components/schemas/CredentialInput'}
        syncIntervalSeconds: {type: integer}
        enabled: {type: boolean}
    ConnectorUpdateRequest:
      type: object
      properties:
        name: {type: string}
        config: {$ref: '#/components/schemas/ConnectorConfig'}
        credential: {$ref: '#/components/schemas/CredentialInput'}
        syncIntervalSeconds: {type: integer}
        enabled: {type: boolean}
    Connector:
      type: object
      properties:
        id: {type: string}
        tenantId: {type: string}
        knowledgeBaseId: {type: string}
        name: {type: string}
        type: {type: string}
        config: {$ref: '#/components/schemas/ConnectorConfig'}
        enabled: {type: boolean}
        syncIntervalSeconds: {type: integer}
        nextSyncAt: {type: string, format: date-time}
        lastSyncAt: {type: string, format: date-time}
        hasCredential: {type: boolean}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConnectorList:
      type: object
      required: [connectors]
      properties:
        connectors:
          type: array
          items: {$ref: '#/components/schemas/Connector'}
    ConnectorRun:
      type: object
      properties:
        id: {type: string}
        tenantId: {type: string}
        connectorId: {type: string}
        knowledgeBaseId: {type: string}
        mode: {type: string}
        status: {type: string}
        cursor: {}
        resumeOfRunId: {type: string}
        triggeredBy: {type: string}
        itemsTotal: {type: integer}
        itemsCreated: {type: integer}
        itemsUpdated: {type: integer}
        itemsDeleted: {type: integer}
        itemsSkipped: {type: integer}
        itemsFailed: {type: integer}
        errorSummary: {type: string}
        cancelRequested: {type: boolean}
        attempts: {type: integer}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    ConnectorRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {$ref: '#/components/schemas/ConnectorRun'}
    ConnectorPermissions:
      type: object
      properties:
        connectorId: {type: string}
        knowledgeBaseId: {type: string}
        sourceAcl: {type: string}
        effectiveAcl: {type: string}
        aclMode: {type: string}
        aclVersion: {type: integer, format: int64}
        members:
          type: array
          items:
            type: object
            properties:
              userId: {type: string}
              role: {type: string}
    CancelResult:
      type: object
      required: [cancelled]
      properties:
        cancelled: {type: boolean}
    StartResult:
      type: object
      required: [started]
      properties:
        started: {type: integer}
    DocumentVersionSummary:
      type: object
      properties:
        id: {type: string}
        version: {type: integer}
        sizeBytes: {type: integer, format: int64}
        status: {type: string}
        errorCode: {type: string}
        errorMessage: {type: string}
    DocumentSummary:
      type: object
      properties:
        document: {type: object, additionalProperties: true}
        version: {$ref: '#/components/schemas/DocumentVersionSummary'}
        contentReady: {type: boolean}
        previewable: {type: boolean}
    DocumentStatus:
      type: object
      properties:
        document: {type: object, additionalProperties: true}
        version: {type: object, additionalProperties: true}
        pipeline: {type: object, additionalProperties: true}
        stages:
          type: array
          items: {type: object, additionalProperties: true}
        contentReady: {type: boolean}
        previewable: {type: boolean}
    DocumentVersionPage:
      type: object
      properties:
        schemaVersion: {type: string}
        documentId: {type: string}
        currentVersionId: {type: string}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              version: {type: integer}
              contentHash: {type: string}
              sizeBytes: {type: integer, format: int64}
              status: {type: string}
              errorCode: {type: string}
              errorMessage: {type: string}
              current: {type: boolean}
              contentReady: {type: boolean}
              restorable: {type: boolean}
              createdAt: {type: string, format: date-time}
    DocumentPreview:
      type: object
      properties:
        schemaVersion: {type: string}
        documentId: {type: string}
        versionId: {type: string}
        knowledgeBaseId: {type: string}
        filename: {type: string}
        mimeType: {type: string}
        status: {type: string}
        title: {type: string}
        language: {type: string}
        parserVersion: {type: string}
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        visibility: {type: string}
    DocumentEnvelope:
      type: object
      required: [document]
      properties:
        document: {type: object, additionalProperties: true}
    ProjectionState:
      type: object
      properties:
        knowledgeBaseId: {type: string}
        joinStatus: {type: string}
        wikiEnabled: {type: boolean}
        graphEnabled: {type: boolean}
        runs: {type: array, items: {type: object, additionalProperties: true}}
        relationRuns: {type: array, items: {type: object, additionalProperties: true}}
        pages: {type: object, additionalProperties: true}
        graph: {type: object, additionalProperties: true}
    WikiPageDetail:
      type: object
      properties:
        page: {type: object, additionalProperties: true}
        version: {type: object, additionalProperties: true}
        blocks: {type: array, items: {type: object, additionalProperties: true}}
        sources: {type: array, items: {type: object, additionalProperties: true}}
    WikiPageList:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items: {type: object, additionalProperties: true}
    WikiVersion:
      type: object
      additionalProperties: true
    WikiVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: {$ref: '#/components/schemas/WikiVersion'}
    WikiRunDetail:
      type: object
      properties:
        run: {type: object, additionalProperties: true}
        stages: {type: array, items: {type: object, additionalProperties: true}}
    WikiRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {type: object, additionalProperties: true}
    KnowledgeSearchResult:
      type: object
      properties:
        query: {type: string}
        items:
          type: array
          items: {type: object, additionalProperties: true}
        joined: {type: boolean}
    GraphQueryResult:
      type: object
      properties:
        query: {type: string}
        snapshotId: {type: string}
        depth: {type: integer}
        nodes: {type: array, items: {type: object, additionalProperties: true}}
        edges: {type: array, items: {type: object, additionalProperties: true}}
        paths: {type: array, items: {type: object, additionalProperties: true}}
        truncated: {type: boolean}
        joined: {type: boolean}
    GraphSnapshotDetail:
      type: object
      properties:
        snapshot: {type: object, additionalProperties: true}
        entities: {type: array, items: {type: object, additionalProperties: true}}
        relations: {type: array, items: {type: object, additionalProperties: true}}
        aliases: {type: array, items: {type: object, additionalProperties: true}}
    GraphSnapshotList:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items: {type: object, additionalProperties: true}
    GraphRunDetail:
      type: object
      properties:
        run: {type: object, additionalProperties: true}
        stages: {type: array, items: {type: object, additionalProperties: true}}
        snapshot: {type: object, additionalProperties: true}
    GraphRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {type: object, additionalProperties: true}
    DeadLetter:
      type: object
      additionalProperties: true
    DeadLetterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DeadLetter'}
    TaskInspection:
      type: object
      required: [task, outbox]
      properties:
        task: {type: object, additionalProperties: true}
        inbox: {type: object, additionalProperties: true}
        pipeline: {type: object, additionalProperties: true}
        stage: {type: object, additionalProperties: true}
        outbox: {type: array, items: {type: object, additionalProperties: true}}
        deadLetter: {type: object, additionalProperties: true}
    ReconcileReport:
      type: object
      properties:
        documentsRepaired: {type: integer, format: int64}
        versionsRepaired: {type: integer, format: int64}
        stagesRequeued: {type: integer}
        pipelinesCancelled: {type: integer}
        inboxesExpired: {type: integer, format: int64}
        deadLettersResolved: {type: integer, format: int64}
paths:

  /api/v1/api-keys:
    get:
      tags: [identity]
      summary: "GET /api/v1/api-keys"
      operationId: get_api_keys
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [identity]
      summary: "POST /api/v1/api-keys"
      operationId: post_api_keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/api-keys/{id}:
    delete:
      tags: [identity]
      summary: "DELETE /api/v1/api-keys/{id}"
      operationId: delete_api_keys_id
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit:
    get:
      tags: [identity]
      summary: "GET /api/v1/audit"
      operationId: get_audit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/audit/authorization:
    get:
      tags: [identity]
      summary: "GET /api/v1/audit/authorization"
      operationId: get_audit_authorization
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/callback:
    get:
      tags: [auth]
      summary: "GET /api/v1/auth/callback"
      operationId: get_auth_callback
      security: []
      responses:
        '302':
          description: Redirect to the web application
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
