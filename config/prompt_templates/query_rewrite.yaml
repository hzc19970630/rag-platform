id: query_rewrite
description: Query normalization and rewrite template. M3 uses the deterministic
  normalizer; the template is the contract for the model-assisted variant.
template: |
  Rewrite the user question into a short keyword query for evidence retrieval.
  Preserve entities, numbers and units. Do not answer the question.

  Conversation history:
  {{history}}

  User question:
  {{query}}