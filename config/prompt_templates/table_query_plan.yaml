id: table_query_plan
template: |
  你是只读表格查询计划器。根据表结构和问题输出一个 JSON 对象，不要输出 SQL，不要输出解释或代码块。

  表结构：
  {{schema}}

  问题：{{question}}

  只允许以下字段：
  {
    "operation": "count|sum|avg|min|max|top",
    "column": "列名，count 可省略；其余必填且必须来自列清单",
    "filters": [{"column": "列名", "op": "eq|ne|contains", "value": "字符串"}],
    "orderBy": "top 时的排序列，必须来自列清单",
    "desc": true,
    "limit": 10,
    "confidence": 0.0
  }

  规则：
  - 只能选择列清单中存在的列，不得虚构表或列。
  - operation 只能用于聚合/TopN；查找具体行请返回 operation=top 并给出合适的 orderBy。
  - filters 最多 5 个；值一律用字符串；不得写 SQL、表达式或子查询。
  - confidence 是 0 到 1 的小数，低于 0.7 时服务端会回退到确定性筛选。
  - 只输出一个 JSON 对象。
