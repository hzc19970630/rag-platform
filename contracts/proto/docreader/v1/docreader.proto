syntax = "proto3";

package docreader.v1;

option go_package = "github.com/hzc19970630/rag-platform/services/docreader/generated;docreaderv1";

service DocumentReader {
  rpc ParseDocument(ParseDocumentRequest) returns (ParseDocumentResponse);
  // Streaming variant: the first frame carries the metadata, every frame may
  // carry content. It removes the single-message size limit from the pipe.
  rpc ParseDocumentStream(stream ParseDocumentChunk) returns (ParseDocumentResponse);
  // Block-streaming variant: the response is split into block batches plus one
  // final summary, so large tables do not hit a single gRPC message cap.
  rpc ParseDocumentBlocks(stream ParseDocumentChunk) returns (stream ParseDocumentEvent);
}

message ParseDocumentRequest {
  string schema_version = 1;
  string document_version_id = 2;
  string filename = 3;
  string mime_type = 4;
  bytes content = 5;
}

message ParseDocumentChunk {
  string schema_version = 1;
  string document_version_id = 2;
  string filename = 3;
  string mime_type = 4;
  bytes content = 5;
}

message ParseDocumentResponse {
  string schema_version = 1;
  string document_version_id = 2;
  string content_hash = 3;
  string mime_type = 4;
  string title = 5;
  string language = 6;
  string parser_version = 7;
  string error_code = 8;
  string error_message = 9;
  repeated DocumentBlock blocks = 10;
  // Table parsing statistics. truncated means the row/sheet/character budget
  // stopped the parser before the whole document was indexed.
  bool truncated = 11;
  int64 total_rows = 12;
  int64 indexed_rows = 13;
  int32 total_sheets = 14;
  int32 indexed_sheets = 15;
  // Per-sheet catalog. Every source sheet appears here even when its rows are
  // not indexed, so coverage can distinguish "not parsed" from "not vectorized".
  repeated SheetMeta sheets = 16;
  // full = all rows indexed, sampled = metadata/sample only, metadata = catalog
  // only. Mirrors the B38 storage tiers.
  string storage_mode = 17;
  // Media the parser could not turn into searchable evidence. They are counted
  // and surfaced in coverage instead of being dropped silently (B40).
  int32 skipped_images = 18;
  int32 skipped_charts = 19;
  int32 skipped_notes = 20;
}

message SheetMeta {
  string name = 1;
  repeated string header = 2;
  int64 declared_rows = 3;
  int64 total_rows = 4;
  int64 parsed_rows = 5;
  int32 column_count = 6;
  int32 header_row = 7;
  string parse_status = 8;
  bool truncated = 9;
  repeated string sample_rows = 10;
  string source_path = 11;
  string stats_source = 12;
}

message TableMeta {
  string sheet = 1;
  repeated string header = 2;
  int32 row_start = 3;
  int32 row_end = 4;
  int32 column_count = 5;
}

message DocumentBlock {
  string block_id = 1;
  string kind = 2;
  string text = 3;
  string heading_path = 4;
  int32 page_number = 5;
  string source_path = 6;
  int32 start_offset = 7;
  int32 end_offset = 8;
  TableMeta table = 9;
}

message TableRow {
  repeated string cells = 1;
}

// TableRowBatch carries full sheet rows for the columnar copy. Rows never enter
// the block stream or the normalized document; the worker forwards each batch
// to the tablehouse materializer.
message TableRowBatch {
  string sheet = 1;
  repeated string header = 2;
  // Per-column logical types: int, float, date, bool, string.
  repeated string column_types = 3;
  int64 row_start = 4;
  repeated TableRow rows = 5;
  // Rows parsed for this sheet up to and including this batch.
  int64 parsed_rows = 6;
  bool sheet_done = 7;
  bool truncated = 8;
  // Sheet-level content hash makes a retried materialization idempotent.
  string content_hash = 9;
}

message ParseDocumentEvent {
  repeated DocumentBlock blocks = 1;
  ParseDocumentResponse summary = 2;
  repeated TableRowBatch table_rows = 3;
}
