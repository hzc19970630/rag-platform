services:
  postgres:
    image: paradedb/paradedb:v0.22.6-pg17@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_platform}
      POSTGRES_USER: ${POSTGRES_USER:-rag_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      RAG_APP_DB_PASSWORD: ${RAG_APP_DB_PASSWORD:-}
      RAG_MAINTENANCE_DB_PASSWORD: ${RAG_MAINTENANCE_DB_PASSWORD:-}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Fresh volumes get the RLS runtime roles before migrations run; existing
      # volumes are handled by scripts/m13_setup_rls_roles.sh.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - tools

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
      - tools

  minio:
    # Version RELEASE.2026-08-04T00-00-00Z, pinned by multi-arch digest.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rag-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
      # Browser origin allowed to PUT presigned upload parts directly.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - tools

  docreader:
    build:
      context: ../..
      dockerfile: services/docreader/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      PARSER_VERSION: ${PARSER_VERSION:-docreader-b39-v1}
      DOCREADER_MAX_FILE_MB: ${DOCREADER_MAX_FILE_MB:-150}
      DOCREADER_SPOOL_MB: ${DOCREADER_SPOOL_MB:-384}
      DOCREADER_SPOOL_CONCURRENCY: ${DOCREADER_SPOOL_CONCURRENCY:-2}
      DOCREADER_SPOOL_WAIT_SECONDS: ${DOCREADER_SPOOL_WAIT_SECONDS:-60}
      DOCREADER_BLOCK_BATCH: ${DOCREADER_BLOCK_BATCH:-200}
      DOCREADER_MAX_ARCHIVE_BYTES: ${DOCREADER_MAX_ARCHIVE_BYTES:-2147483648}
      DOCREADER_MAX_PART_BYTES: ${DOCREADER_MAX_PART_BYTES:-67108864}
      DOCREADER_MAX_READ_BYTES: ${DOCREADER_MAX_READ_BYTES:-2147483648}
      DOCREADER_MAX_TABLE_ROWS_PER_SHEET: ${DOCREADER_MAX_TABLE_ROWS_PER_SHEET:-50000}
      DOCREADER_MAX_TABLE_ROWS: ${DOCREADER_MAX_TABLE_ROWS:-2000000}
      DOCREADER_TABLE_ROW_BATCH_ROWS: ${DOCREADER_TABLE_ROW_BATCH_ROWS:-5000}
      DOCREADER_TABLE_WINDOW_ROWS: ${DOCREADER_TABLE_WINDOW_ROWS:-50}
      DOCREADER_TABLE_SAMPLE_ROWS: ${DOCREADER_TABLE_SAMPLE_ROWS:-50}
      DOCREADER_MAX_TABLE_BLOCKS: ${DOCREADER_MAX_TABLE_BLOCKS:-20000}
      DOCREADER_MAX_SHEET_BLOCKS: ${DOCREADER_MAX_SHEET_BLOCKS:-2000}
      DOCREADER_TABLE_STORAGE_FULL_MAX_ROWS: ${DOCREADER_TABLE_STORAGE_FULL_MAX_ROWS:-200000}
      DOCREADER_TABLE_STORAGE_METADATA_MIN_ROWS: ${DOCREADER_TABLE_STORAGE_METADATA_MIN_ROWS:-5000000}
    expose:
      - "50051"
      - "8080"
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    cpus: "${PARSER_SANDBOX_CPU_LIMIT:-2}"
    mem_limit: "${PARSER_SANDBOX_MEMORY_MB:-2048}m"
    pids_limit: ${PARSER_SANDBOX_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile is applied when no custom profile is set.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      # Streaming parse spool. tmpfs counts toward the 2GiB memory limit; the
      # docreader enforces the same budget plus a 2-parse concurrency gate.
      - /spool:rw,noexec,nosuid,size=${DOCREADER_SPOOL_MB:-384}m,uid=10001,gid=10001,mode=0700
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  tablehouse:
    build:
      context: ../..
      dockerfile: services/tablehouse/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      S3_ENDPOINT: minio:9000
      S3_BUCKET: ${S3_BUCKET:-rag-platform-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-rag-local}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-change-me-local-only}}
      S3_USE_TLS: ${S3_USE_TLS:-false}
      TABLEHOUSE_S3_PREFIX: ${TABLEHOUSE_S3_PREFIX:-tablehouse}
      TABLEHOUSE_MEMORY_MB: ${TABLEHOUSE_MEMORY_MB:-1024}
      TABLEHOUSE_QUERY_TIMEOUT_SECONDS: ${TABLEHOUSE_QUERY_TIMEOUT_SECONDS:-10}
      TABLEHOUSE_MAX_CONCURRENCY: ${TABLEHOUSE_MAX_CONCURRENCY:-2}
      TABLEHOUSE_ROW_GROUP_ROWS: ${TABLEHOUSE_ROW_GROUP_ROWS:-100000}
      TABLEHOUSE_MAX_SHEET_ROWS: ${TABLEHOUSE_MAX_SHEET_ROWS:-5000000}
      TABLEHOUSE_PORT: "8088"
      HOME: /tmp
    expose:
      - "8088"
    depends_on:
      minio:
        condition: service_healthy
    read_only: true
    user: "10002:10002"
    cap_drop: ["ALL"]
    mem_limit: ${TABLEHOUSE_MEMORY_LIMIT_MB:-2048}m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://goproxy.cn,direct}
    env_file:
      - path: ../../.env
        required: false
    environment:
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rag_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-rag_platform}?sslmode=disable}
      MAINTENANCE_DATABASE_URL: ${MAINTENANCE_DATABASE_URL:-}
      TENANT_RLS_MODE: ${TENANT_RLS_MODE:-shadow}
      REDIS_ADDR: redis:6379
      DOCREADER_GRPC_ADDR: docreader:50051
      PARSER_VERSION: ${PARSER_VERSION:-docreader-b39-v1}
      S3_ENDPOINT: minio:9000
      TABLEHOUSE_URL: ${TABLEHOUSE_URL:-http://tablehouse:8088}
      TABLEHOUSE_S3_PREFIX: ${TABLEHOUSE_S3_PREFIX:-tablehouse}
      TABLEHOUSE_QUERY_TIMEOUT_SECONDS: ${TABLEHOUSE_QUERY_TIMEOUT_SECONDS:-10}
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      docreader:
        condition: service_healthy
      tablehouse:
        condition: service_healthy
    ports:
      - "${API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
      - frontend

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://goproxy.cn,direct}
    entrypoint: ["/usr/local/bin/migrate"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rag_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-rag_platform}?sslmode=disable}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      TENANT_RLS_MODE: ${TENANT_RLS_MODE:-shadow}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  seed:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://goproxy.cn,direct}
    entrypoint: ["/usr/local/bin/seed"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rag_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-rag_platform}?sslmode=disable}
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      TENANT_RLS_MODE: ${TENANT_RLS_MODE:-shadow}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GO_PROXY:-https://goproxy.cn,direct}
    entrypoint: ["/usr/local/bin/worker"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rag_platform}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-rag_platform}?sslmode=disable}
      MAINTENANCE_DATABASE_URL: ${MAINTENANCE_DATABASE_URL:-}
      TENANT_RLS_MODE: ${TENANT_RLS_MODE:-shadow}
      REDIS_ADDR: redis:6379
      DOCREADER_GRPC_ADDR: docreader:50051
      TABLEHOUSE_URL: ${TABLEHOUSE_URL:-http://tablehouse:8088}
      TABLEHOUSE_S3_PREFIX: ${TABLEHOUSE_S3_PREFIX:-tablehouse}
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy
      tablehouse:
        condition: service_healthy
    networks:
      - backend
      # The worker calls the embedding provider over the public internet when
      # EMBEDDING_SOURCE=remote, and `backend` is internal-only (no egress or
      # external DNS), so it needs this network too.
      - frontend

  web:
    build:
      context: ../../web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    environment:
      VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8082}/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - frontend

  # Development-only OIDC provider. The checked-in realm fixture contains local
  # credentials and must not be used in production. KC_HOSTNAME has to be
  # reachable from both the host browser and the api container, so localhost
  # only works when the API is not containerized.
  keycloak:
    image: keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8083}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8083:8080"
    volumes:
      - ../keycloak/rag-realm.json:/opt/keycloak/data/import/rag-realm.json:ro
    networks:
      - frontend

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  backend:
    internal: true
  frontend:
  # Non-internal network used only so the published host ports for postgres,
  # redis and minio work; application traffic stays on the internal backend.
  tools:
